name: IPO calendar regression
on:
  push:
    branches: [codex/ipo-calendar-20261118]
  pull_request:
    paths:
      - 'app.js'
      - 'data/checkpoints.json'
      - 'data/headline.json'
      - 'tests/test_ipo_calendar.cjs'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check app.js
          node --check news.js
          node --check sw.js
          node tests/test_ipo_calendar.cjs
          node tests/test_moves_display.cjs
          node tests/test_index_chart_render.cjs
