name: Official BEA checkpoints
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-bea-checkpoints
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify official calendar and update only BEA rows
        run: python3 tools/sync_bea_checkpoints.py
      - name: Publish verified schedule changes
        run: |
          if git diff --quiet -- data/checkpoints.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/checkpoints.json
          git commit -m 'Sync official BEA release checkpoints'
          git push origin HEAD
