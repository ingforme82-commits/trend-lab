<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스터디 아카이브 | Trend Research Lab</title>
<meta property="og:title" content="스터디 아카이브 | Trend Research Lab">
<meta property="og:description" content="매달 오프라인 스터디의 사진과 내용을 모았습니다">
<meta property="og:image" content="https://ingforme82-commits.github.io/trend-lab/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="index.html"><span class="brand-mark">TRL</span><span class="brand-txt">Trend Research Lab</span></a>
    <nav class="nav-links">
      <a href="index.html#feed">시황 업데이트</a>
      <a href="index.html#quiz">성향 테스트</a>
      <a href="index.html#archive">스터디 아카이브</a>
    </nav>
    <a class="btn btn-kakao btn-sm" href="https://invite.kakao.com/tc/p7OX5rMjd0" target="_blank" rel="noopener">오픈채팅</a>
  </div>
</header>

<main class="sec">
  <div class="wrap sv" id="sv"><p class="empty">불러오는 중…</p></div>
</main>

<div class="lb" id="lb" hidden>
  <button class="lb-x" id="lbX" aria-label="닫기">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="이전">‹</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <button class="lb-nav lb-next" id="lbNext" aria-label="다음">›</button>
</div>

<footer class="foot">
  <div class="wrap">
    <p><b>조영근 추세추종 리서치 랩 | Trend Research Lab</b></p>
    <p>본 모임은 교육 목적이며, 특정 종목을 추천하지 않고 수익을 보장하지 않습니다.</p>
  </div>
</footer>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const fmt = (d) => { const x = new Date(d + "T00:00:00"); return `${x.getFullYear()}년 ${x.getMonth() + 1}월 ${x.getDate()}일(${DOW[x.getDay()]})`; };
let photos = [], cur = 0;

(async () => {
  const id = new URLSearchParams(location.search).get("id");
  let list = [];
  try { list = await (await fetch(`data/studies.json?t=${Date.now()}`)).json(); } catch { /* 아래에서 안내 */ }
  list.sort((a, b) => b.date.localeCompare(a.date));
  const i = list.findIndex((s) => s.id === id);
  const s = list[i];
  if (!s) { $("#sv").innerHTML = `<p class="empty">스터디 기록을 찾지 못했습니다. <a href="index.html#archive">아카이브로 돌아가기</a></p>`; return; }
  document.title = `${s.title} | 스터디 아카이브`;
  const k = new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000);
  const today = `${k.getFullYear()}-${String(k.getMonth() + 1).padStart(2, "0")}-${String(k.getDate()).padStart(2, "0")}`;
  photos = s.photos || [];
  const newer = list[i - 1], older = list[i + 1];
  $("#sv").innerHTML = `
    <p class="sv-back"><a href="index.html#archive">← 스터디 아카이브</a></p>
    <p class="eyebrow dark">${fmt(s.date)}${s.time ? " " + esc(s.time) : ""} · 오프라인 스터디${s.date > today ? " · 예정" : ""}</p>
    <h1 class="sv-title">${esc(s.title)}</h1>
    ${s.theme ? `<p class="sv-theme">${esc(s.theme)}</p>` : ""}
    <ul class="sv-meta">
      ${s.book ? `<li>📖 ${esc(s.book)}</li>` : ""}
      ${s.place ? `<li>📍 ${esc(s.place)}</li>` : ""}
      ${photos.length ? `<li>📷 사진 ${photos.length}장</li>` : ""}
    </ul>
    ${s.summary ? `<p class="sv-sum">${esc(s.summary)}</p>` : ""}
    ${photos.length ? `<h2 class="sv-h">현장 사진</h2><div class="gal">${photos.map((p, k) => `<button class="gal-i" data-k="${k}"><img src="${esc(p.thumb)}" alt="${esc(p.caption || s.title)}" loading="lazy"></button>`).join("")}</div>`
      : `<div class="sv-empty">${s.date > today ? "🗓️ 아직 열리지 않은 스터디입니다. 참여 신청은 아래 오픈채팅에서 받습니다." : "📷 사진과 후기를 정리하고 있습니다."}</div>`}
    ${(s.notes || []).length ? `<h2 class="sv-h">이날 나눈 이야기</h2>${s.notes.map((n) => n.h ? `<div class="sv-note"><h3>${esc(n.h)}</h3>${(n.p || []).map((x) => `<p>${esc(x)}</p>`).join("")}</div>` : `<div class="sv-note"><p>${esc(n)}</p></div>`).join("")}` : ""}
    ${(s.materials || []).length ? `<h2 class="sv-h">자료</h2><ul class="sv-mat">${s.materials.map((m) => `<li><a href="${esc(m.url)}" target="_blank" rel="noopener">📎 ${esc(m.name)}</a></li>`).join("")}</ul>` : ""}
    <div class="sv-pn">
      ${older ? `<a href="study.html?id=${encodeURIComponent(older.id)}"><small>이전 스터디</small>${esc(older.title)}</a>` : "<span></span>"}
      ${newer ? `<a class="r" href="study.html?id=${encodeURIComponent(newer.id)}"><small>다음 스터디</small>${esc(newer.title)}</a>` : "<span></span>"}
    </div>
    <div class="sv-cta"><p>다음 스터디 일정과 참여 신청은 카카오톡 오픈채팅에서 안내합니다.</p><a class="btn btn-kakao" href="https://invite.kakao.com/tc/p7OX5rMjd0" target="_blank" rel="noopener">💬 오픈채팅 참여하기</a></div>`;
})();

function openLb(k) {
  cur = (k + photos.length) % photos.length;
  const p = photos[cur];
  $("#lbImg").src = p.src; $("#lbCap").textContent = `${p.caption ? p.caption + " · " : ""}${cur + 1} / ${photos.length}`;
  $("#lb").hidden = false; document.body.style.overflow = "hidden";
}
function closeLb() { $("#lb").hidden = true; document.body.style.overflow = ""; }
document.addEventListener("click", (e) => { const g = e.target.closest(".gal-i"); if (g) openLb(+g.dataset.k); });
$("#lbX").onclick = closeLb;
$("#lbPrev").onclick = () => openLb(cur - 1);
$("#lbNext").onclick = () => openLb(cur + 1);
$("#lb").addEventListener("click", (e) => { if (e.target.id === "lb") closeLb(); });
document.addEventListener("keydown", (e) => {
  if ($("#lb").hidden) return;
  if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") openLb(cur - 1); else if (e.key === "ArrowRight") openLb(cur + 1);
});
let tx = null;
$("#lb").addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
$("#lb").addEventListener("touchend", (e) => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) openLb(cur + (dx < 0 ? 1 : -1)); tx = null; });
</script>
</body>
</html>
